<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img"><rect width="1000" height="600" fill="#fff"/><text x="500" y="70" text-anchor="middle" fill="#162033" font-family="Arial" font-size="34" font-weight="700">Make one meaningful swap at a time</text><g font-family="Arial"><rect x="60" y="150" width="390" height="340" rx="24" fill="#ffedd5"/><rect x="550" y="150" width="390" height="340" rx="24" fill="#dcfce7"/><text x="255" y="210" text-anchor="middle" fill="#9a3412" font-size="27" font-weight="700">Noodles → greens</text><text x="255" y="260" text-anchor="middle" fill="#475569" font-size="21">Listed change: −255 calories</text><path d="M135 365q120 105 240 0" fill="none" stroke="#ea580c" stroke-width="38" stroke-linecap="round"/><text x="745" y="210" text-anchor="middle" fill="#166534" font-size="27" font-weight="700">Creamy → lighter sauce</text><text x="745" y="260" text-anchor="middle" fill="#475569" font-size="21">Listed change: −115 calories</text><circle cx="680" cy="360" r="55" fill="#f59e0b"/><circle cx="810" cy="360" r="55" fill="#38bdf8"/><path d="M760 360h-35" stroke="#162033" stroke-width="9"/><text x="255" y="445" text-anchor="middle" fill="#475569" font-size="17">Texture and carbohydrate change too.</text><text x="745" y="445" text-anchor="middle" fill="#475569" font-size="17">Flavor, sodium, and allergens can change too.</text></g></svg>
