<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img"><rect width="1000" height="600" fill="#fffaf5"/><text x="500" y="72" text-anchor="middle" fill="#162033" font-family="Arial" font-size="34" font-weight="700">Read nutrition facts in this order</text><g font-family="Arial" text-anchor="middle" font-weight="700"><g transform="translate(65 180)"><rect width="170" height="230" rx="22" fill="#ffedd5"/><circle cx="85" cy="65" r="38" fill="#fb923c"/><text x="85" y="135" fill="#9a3412" font-size="23">1. Serving</text><text x="85" y="168" fill="#475569" font-size="17">Check oz or</text><text x="85" y="192" fill="#475569" font-size="17">fluid oz first</text></g><g transform="translate(290 180)"><rect width="170" height="230" rx="22" fill="#fef3c7"/><circle cx="85" cy="65" r="38" fill="#f59e0b"/><text x="85" y="135" fill="#92400e" font-size="23">2. Calories</text><text x="85" y="168" fill="#475569" font-size="17">Listed energy</text><text x="85" y="192" fill="#475569" font-size="17">per serving</text></g><g transform="translate(515 180)"><rect width="170" height="230" rx="22" fill="#dcfce7"/><circle cx="85" cy="65" r="38" fill="#22c55e"/><text x="85" y="135" fill="#166534" font-size="23">3. Macros</text><text x="85" y="168" fill="#475569" font-size="17">Protein, carbs,</text><text x="85" y="192" fill="#475569" font-size="17">fat and fiber</text></g><g transform="translate(740 180)"><rect width="170" height="230" rx="22" fill="#e0f2fe"/><circle cx="85" cy="65" r="38" fill="#38bdf8"/><text x="85" y="135" fill="#075985" font-size="23">4. Checks</text><text x="85" y="168" fill="#475569" font-size="17">Sodium and</text><text x="85" y="192" fill="#475569" font-size="17">allergens</text></g></g><path d="M235 295h45m180 0h45m180 0h45" stroke="#fb923c" stroke-width="8" stroke-linecap="round"/></svg>
